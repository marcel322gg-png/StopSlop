name: Deploy StopSlop model catalog

on:
  workflow_run:
    workflows: [Publish StopSlop E5 model release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Existing published model release version (semantic X.Y.Z)
        required: true
        default: 1.0.0
        type: string

permissions:
  contents: read

concurrency:
  group: stop-slop-catalog-pages
  cancel-in-progress: false

jobs:
  deploy-catalog:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out trusted catalog source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Set up locked Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.9
          cache: pip
          cache-dependency-path: tools/model-package-requirements.lock

      - name: Require GitHub Pages Actions source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/check_stop_slop_pages.py

      - name: Download the successful publisher's short-lived version context
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stop-slop-release-context
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: artifacts/release-context

      - name: Resolve and validate the published release catalog
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("artifacts/release-context/context.json").read_text())["version"])')"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must be semantic X.Y.Z" >&2; exit 1; }
          python tools/fetch_stop_slop_release_metadata.py --version "$version" --output site-dist
          size="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("site-dist/catalog/v1/catalog.json").read_text())["models"][0]["packageSizeBytes"])')"
          sha="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("site-dist/catalog/v1/catalog.json").read_text())["models"][0]["sha256"])')"
          python tools/validate_stop_slop_catalog.py \
            site-dist/catalog/v1/catalog.json --size "$size" --sha256 "$sha" --version "$version"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site-dist

      - name: Deploy model catalog
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
