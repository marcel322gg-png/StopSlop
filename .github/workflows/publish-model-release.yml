name: Publish StopSlop E5 model release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Model package version (semantic X.Y.Z)
        required: true
        default: 1.0.0
        type: string
  push:
    tags:
      - model-v*

permissions:
  contents: read

concurrency:
  group: stop-slop-model-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-model:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out trusted main packaging source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Set up locked Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.9
          cache: pip
          cache-dependency-path: tools/model-package-requirements.lock

      - name: Validate deliberate model version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            [[ "$REF_NAME" =~ ^model-v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "Tag must use model-vX.Y.Z" >&2; exit 1; }
            version="${BASH_REMATCH[1]}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must be semantic X.Y.Z" >&2; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Install pinned model conversion dependencies
        run: python -m pip install --disable-pip-version-check --requirement tools/model-package-requirements.lock

      - name: Fetch immutable upstream encoder and tokenizer sources
        run: python tools/fetch_stop_slop_e5_sources.py

      - name: Rebuild tokenizer graph from pinned tokenizer files
        run: >-
          python tools/generate_stop_slop_tokenizer_onnx.py
          model-packages/source/tokenizer
          model-packages/source/tokenizer.onnx

      - name: Build optional data-only model package
        run: python tools/package_stop_slop_e5_model.py

      - name: Audit package paths, metadata, license and all hashes
        id: audit
        env:
          MODEL_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_stop_slop_model_package.py \
            artifacts/model-packages/multilingual-e5-small.ssmodel \
            --version "$MODEL_VERSION" --output artifacts/model-release
          size="$(python -c 'from pathlib import Path; print(Path("artifacts/model-packages/multilingual-e5-small.ssmodel").stat().st_size)')"
          sha="$(python -c 'import hashlib; from pathlib import Path; print(hashlib.sha256(Path("artifacts/model-packages/multilingual-e5-small.ssmodel").read_bytes()).hexdigest())')"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Render and validate release catalog against the built package
        env:
          MODEL_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          python tools/render_stop_slop_catalog.py \
            --version "$MODEL_VERSION" \
            --size "${{ steps.audit.outputs.size }}" \
            --sha256 "${{ steps.audit.outputs.sha256 }}" \
            --output artifacts/model-release/catalog.json
          python tools/validate_stop_slop_catalog.py \
            artifacts/model-release/catalog.json \
            --package artifacts/model-packages/multilingual-e5-small.ssmodel \
            --version "$MODEL_VERSION"

      - name: Create a collision-safe GitHub Release and attach verified assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_VERSION: ${{ steps.version.outputs.value }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            python tools/publish_stop_slop_model_release.py \
              --version "$MODEL_VERSION" \
              --package artifacts/model-packages/multilingual-e5-small.ssmodel \
              --metadata-dir artifacts/model-release --allow-tag-from-push
          else
            python tools/publish_stop_slop_model_release.py \
              --version "$MODEL_VERSION" \
              --package artifacts/model-packages/multilingual-e5-small.ssmodel \
              --metadata-dir artifacts/model-release
          fi

      - name: Record the published version for the Pages workflow
        env:
          MODEL_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p artifacts/release-context
          python -c 'import json, os; open("artifacts/release-context/context.json", "w").write(json.dumps({"version": os.environ["MODEL_VERSION"]}) + "\n")'

      - name: Upload short-lived deployment context
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stop-slop-release-context
          path: artifacts/release-context/context.json
          retention-days: 5
